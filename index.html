<html lang="id"><head><meta charset="utf-8">

<title>Sistem Manajemen Formulir - KAI</title>

<style>
:root{--bg:#fff;--pg:#f8f9fb;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--pri:#1d4ed8;--ps:#eff6ff;--hd:#f9fafb;--ok:#dcfce7;--okt:#166534;--wn:#fef9c3;--wt:#854d0e;--er:#fee2e2;--ert:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171d2b;--pg:#0f1420;--tx:#e5e7eb;--mu:#9ca3af;--bd:#2a3244;--pri:#60a5fa;--ps:#1e2a44;--hd:#1c2333;--ok:#14532d;--okt:#bbf7d0;--wn:#422006;--wt:#fde68a;--er:#450a0a;--ert:#fecaca}}
:root[data-theme=dark]{--bg:#171d2b;--pg:#0f1420;--tx:#e5e7eb;--mu:#9ca3af;--bd:#2a3244;--pri:#60a5fa;--ps:#1e2a44;--hd:#1c2333;--ok:#14532d;--okt:#bbf7d0;--wn:#422006;--wt:#fde68a;--er:#450a0a;--ert:#fecaca}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:13px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;height:52px;background:var(--bg);border-bottom:1px solid var(--bd)}
.lg{width:220px;display:flex;align-items:center;gap:10px;padding:0 16px}.lg b{font-weight:700}.lg .k{font-weight:800;color:var(--pri);border-bottom:3px solid #f97316;line-height:1;letter-spacing:-.5px}
button{font-family:inherit;color:inherit}#ttl{font-weight:600;font-size:15px}
.av{width:26px;height:26px;border-radius:50%;background:#0e9aa7;color:#fff;display:grid;place-items:center;font:600 10px Inter;flex:none}header .av{margin-left:auto;margin-right:16px}
.body{display:flex}aside{width:220px;border-right:1px solid var(--bd);padding:14px 10px;display:flex;flex-direction:column;position:sticky;top:calc(52px + env(safe-area-inset-top,0px));height:calc(100vh - 52px);align-self:flex-start;background:var(--bg)}
.n{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;border:0;background:none;width:100%;text-align:left;font:500 13px Inter;cursor:pointer}.n.on{background:var(--ps);color:var(--pri)}
.usr{margin-top:auto;display:flex;gap:8px;align-items:center;padding:10px 4px 0;border-top:1px solid var(--bd);font-size:11px}.usr small{display:block;color:var(--mu)}
.rs{border:0;background:none;color:var(--mu);font-size:10px;cursor:pointer;text-align:left;padding:8px 4px 0;text-decoration:underline}
body.c aside{display:none}body.c .lg{width:auto}
main{flex:1;min-width:0;background:var(--pg);padding:22px 24px;min-height:calc(100vh - 52px)}main>*{max-width:1100px;margin-left:auto;margin-right:auto}
@media(max-width:800px){aside{position:fixed;left:0;top:calc(52px + env(safe-area-inset-top,0px));bottom:0;z-index:9;height:auto;box-shadow:4px 0 20px rgba(0,0,0,.2)}main{padding:14px}.lg{width:auto}#ttl{font-size:13px}}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px}
.ch{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}.ico{width:40px;height:40px;border-radius:10px;background:var(--er);color:var(--ert);display:grid;place-items:center;flex:none}
h1{margin:0;font-size:19px;font-weight:800}.ch p{margin:2px 0 0;font-size:11px;color:var(--mu)}.grow{flex:1;min-width:180px}h2{margin:0 0 14px;font-size:18px}h3{margin:10px 0 4px}
.sr{display:flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:6px;padding:0 8px;background:var(--bg);color:var(--mu)}.sr input{border:0;outline:0;background:none;padding:7px 0;width:150px}.grow .sr input{width:100%}
input,select,textarea{font:12px Inter;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:7px 8px;width:100%}input:disabled,select:disabled{background:var(--hd);color:var(--mu)}
.b{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--bg);border-radius:6px;padding:7px 11px;font:600 11px Inter;cursor:pointer}
.b.p{background:var(--pri);border-color:var(--pri);color:#fff}.b.g{background:#16a34a;border-color:#16a34a;color:#fff}.b.dg{background:#dc2626;border-color:#dc2626;color:#fff}.b.y{background:var(--wn);color:var(--wt);border-color:transparent;padding:4px 8px}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.tabs{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--hd);border:1px solid var(--bd);border-radius:10px;padding:3px;margin-bottom:16px}.tabs button{border:0;background:none;color:var(--mu);padding:6px 12px;border-radius:8px;font:500 11px Inter;cursor:pointer}.tabs .on{background:var(--bg);color:var(--pri);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.sub{display:flex;gap:16px;border-bottom:1px solid var(--bd);margin-bottom:14px}.sub button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 2px;font:500 11px Inter;color:var(--mu);cursor:pointer}.sub .on{color:var(--pri);border-color:var(--pri);font-weight:600}
.tb{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:12px}.tb .sr{margin-right:auto}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:11.5px}th{background:var(--hd);text-align:left;font-weight:600;padding:9px 8px;white-space:nowrap}td{padding:10px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}tbody tr:hover{background:var(--hd)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px}.mu{color:var(--mu)}.em{text-align:center;color:var(--mu);padding:26px}
.bd{display:inline-block;padding:1px 8px;border-radius:99px;font-size:10px;font-weight:600;background:var(--hd);color:var(--mu)}.bd.wn{background:var(--wn);color:var(--wt)}.bd.ok{background:var(--ok);color:var(--okt)}.bd.er{background:var(--er);color:var(--ert)}
.ac{display:flex;gap:6px;align-items:center}.ib{border:0;background:none;border-radius:5px;padding:3px;cursor:pointer;display:grid;place-items:center}.b1{color:var(--pri)}.g1{color:var(--okt)}.r1{color:var(--ert)}.y2{color:var(--wt)}.ib:hover{background:var(--hd)}
.pf{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:11px;color:var(--mu)}.pn{display:flex;gap:4px}.pn button{min-width:26px;height:26px;border:1px solid var(--bd);background:var(--bg);border-radius:5px;cursor:pointer}.pn .on{background:var(--ps);color:var(--pri);border-color:var(--pri);font-weight:700}
.fl{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;background:var(--hd);padding:12px;border-radius:8px}.fl label{font-size:9px;font-weight:700;color:var(--mu);display:grid;gap:4px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:20;padding:16px}.bx{background:var(--bg);border-radius:12px;width:100%;max-width:440px;max-height:90vh;display:flex;flex-direction:column}.bx.w{max-width:780px}
.mh{display:flex;justify-content:space-between;padding:16px 18px 8px}.mh small{display:block;color:var(--mu);font-size:11px;margin-top:2px}.mb{padding:8px 18px;overflow:auto}.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;align-items:center}#me{color:var(--ert);font-size:11px;margin-right:auto}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f{display:grid;gap:4px;font-size:11px;font-weight:600;align-content:start}.f.full{grid-column:1/-1}.info{grid-column:1/-1;background:var(--ps);color:var(--pri);padding:9px 11px;border-radius:6px;font-size:11px}
.x{cursor:pointer;color:var(--mu);font-size:18px;line-height:1;border:0;background:none}
.tst{display:flex;justify-content:space-between;background:var(--ok);color:var(--okt);border:1px solid #86efac;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:11.5px}.tst.er{background:var(--er);color:var(--ert);border-color:#fca5a5}
.back{font-size:11px;color:var(--mu);cursor:pointer;border:0;background:none;padding:0;margin-bottom:10px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px}.st .card{margin:0}.st small{color:var(--mu)}.st b{display:block;font-size:26px}
.two{display:grid;grid-template-columns:2fr 1fr;gap:16px}@media(max-width:800px){.two{grid-template-columns:1fr}.g{grid-template-columns:1fr}}
.bar{display:grid;grid-template-columns:96px 1fr 22px;align-items:center;gap:8px;margin-top:8px;font-size:11px}.bar i{display:block;height:8px;border-radius:4px;background:var(--pri)}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sh select{width:auto}.note{font-size:11px;font-style:italic;color:var(--mu);font-weight:600}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:11px;margin-top:8px}

:root{--pg:#eceff4;--pri:#0f3a8a;--ps:#e6edfb;--hd:#f3f5f9;--bd:#dde2ec;--or:#f47920}
*{font-family:'IBM Plex Sans',system-ui,sans-serif!important}
h1,h2,.lg b,#ttl,.st b{font-family:'Barlow Condensed',sans-serif!important}.mono,textarea{font-family:'IBM Plex Mono',monospace!important}
header{border-bottom:0}header:after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:repeating-linear-gradient(90deg,#f47920 0 18px,#0f3a8a 18px 36px)}
#ttl{font-size:21px;font-weight:700}header .av{margin-left:0}#th{margin-left:auto;margin-right:12px}

.usr{border-color:rgba(255,255,255,.14);color:#fff}.usr small,.rs{color:#8ea0c8}
.card{border:0;border-top:3px solid var(--pri);border-radius:6px;box-shadow:0 1px 0 rgba(15,30,70,.08),0 10px 24px -14px rgba(15,30,70,.35)}.st .card{border-top-color:var(--or)}
h1{font-size:30px;line-height:1;font-weight:700}h2{font-size:26px}.st b{font-size:40px;line-height:1.1}.ico{border-radius:6px;background:var(--pri);color:#fff}
.tabs{background:none;border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:0;gap:18px}.tabs button{border-radius:0;padding:9px 2px;font-size:12px;border-bottom:3px solid transparent}.tabs .on{background:none;box-shadow:none;border-color:var(--or);color:var(--tx)}
.b{border-radius:4px}.b.p{background:var(--pri);border-color:var(--pri)}[data-a=fnew]{background:var(--or)!important;border-color:var(--or)!important}
th{background:#0b2350;color:#fff;font-size:11px}tbody tr:nth-child(even){background:var(--hd)}
@media print{header,aside,main{display:none!important}.ov{position:static;background:none;display:block}.bx{max-height:none;max-width:none}.mb{overflow:visible}.mf,.mh button{display:none}th{background:#eee!important;color:#000}}

#lgn{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;overflow:auto}.lgw{display:grid;grid-template-columns:1.1fr 1fr;min-height:100%}
.lgl{background:linear-gradient(160deg,#0b2350,#173a86);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center;gap:18px}.lgl img{background:#fff;border-radius:14px;padding:12px 20px;align-self:flex-start;width:180px}.lgl h1{font-size:48px;line-height:1.02}.lgl p{max-width:380px;color:#c8d3ea;font-size:14px;margin:0}
.lgr{align-self:center;justify-self:center;width:min(360px,88%);display:grid;gap:14px;padding:24px 0}.lgr h2{font-size:34px;margin:0}.lgr input{padding:10px}#le{color:var(--ert);font-size:12px;min-height:14px}
@media(max-width:800px){.lgw{grid-template-columns:1fr}.lgl{padding:28px}.lgl h1{font-size:32px}}
aside{overflow-y:auto}nav#nv{display:grid;gap:2px}.mg{font-size:10px;color:#6f83b0;padding:12px 10px 4px}.n svg{flex:none}#th{margin-left:0}.tabs,.back{display:none}
.bg{position:absolute;top:-5px;right:-6px;background:var(--or);color:#fff;font:700 9px sans-serif!important;border-radius:9px;padding:1px 5px;font-style:normal}
.card{border-top:0;border-radius:12px}.st .card{border-left:4px solid var(--or)}.st .card:nth-child(2){border-left-color:#16a34a}.st .card:nth-child(3){border-left-color:#0f3a8a}.st .card:nth-child(4){border-left-color:#dc2626}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cd{min-height:80px;border:1px solid var(--bd);border-radius:6px;padding:4px;overflow:hidden}.cd .bd{display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cd.now{border-color:var(--or);background:var(--ps)}

ffin(d){const f=DB.f[d.i];conf('Finalkan formulir?',`${esc(f.ref)} tidak dapat diubah lagi setelah final.`,()=>{f.status='Final';done(`Formulir ${f.ref} telah difinalkan.`)},'Finalkan')},

fview(d){const f=DB.f[d.i],ak=DB.a.filter(x=>x.aktif),fin=f.status=='Final',dis=fin?'disabled':'';modal(esc(f.ref),`${fl(f.tgl)}, petugas ${esc(f.petugas)}, status ${f.status}`,`<div class="tw"><table><thead><tr><th>Kode</th><th>Lokasi</th><th>Kedaluwarsa</th><th>Kondisi</th><th>Catatan</th></tr></thead><tbody>${ak.map(x=>{const c=f.cek[x.kode]||{k:'Baik',c:''};return`<tr><td><b class="mono">${x.kode}</b></td><td>${esc(x.lokasi)}<br><span class="mu">${esc(x.sub)}</span></td><td>${expc(x)}</td><td><select data-k="${x.kode}" data-f="k" ${dis}>${KOND.map(o=>`<option ${o==c.k?'selected':''}>${o}</option>`).join('')}</select></td><td><input data-k="${x.kode}" data-f="c" value="${esc(c.c)}" ${dis}></td></tr>`}).join('')}</tbody></table></div>`,fin?null:()=>{document.querySelectorAll('#m [data-k]').forEach(e=>{(f.cek[e.dataset.k]??={k:'Baik',c:''})[e.dataset.f]=e.value});done(`Checklist ${f.ref} berhasil disimpan.`)},'Simpan checklist','p','w')},
aadd(){modal('Tambah APAR','Isi data alat pemadam baru.',form(AF,{tipe:'Stored Pressure',isi:td0,exp:nextY,vendor:(DB.v[0]||{}).nama}),()=>{const o=rd(),e=ver(o,1);if(e)return e;DB.a.push({...o,aktif:1});lg(o.kode,'Tambah APAR','-','Aktif',`Aset APAR ${o.kode} ditambahkan.`);done(`Aset APAR ${o.kode} berhasil ditambahkan.`)})},
aedit(d){const x=DB.a[d.i];modal('Edit APAR',x.kode,form(AF,x,['kode']),()=>{const o=rd(),e=ver(o);if(e)return e;Object.assign(x,o);lg(x.kode,'Ubah Data','-','-',`Data aset APAR ${x.kode} diperbarui.`);done(`Aset APAR ${x.kode} berhasil diperbarui.`)})},
adel(d){const x=DB.a[d.i];conf('Nonaktifkan APAR?',`${x.kode} akan dipindahkan ke APAR Non Aktif.`,()=>{x.aktif=0;lg(x.kode,'Nonaktif','Aktif','Non Aktif',`Aset APAR ${x.kode} dinonaktifkan.`);done(`Aset APAR ${x.kode} berhasil dinonaktifkan.`)},'Nonaktifkan')},
arep(d){const x=DB.a[d.i],na=DB.a.filter(y=>!y.aktif);if(!na.length)return toast('Belum ada APAR non aktif yang bisa dijadikan pengganti.',1);modal('Penggantian Aset APAR',x.kode,`<label class="f">Aset pengganti (non aktif)<select name="p">${na.map(y=>`<option>${y.kode}</option>`).join('')}</select></label><p class="mu">${x.kode} akan dinonaktifkan dan aset pengganti diaktifkan.</p>`,()=>{const y=DB.a.find(z=>z.kode==rd().p);x.aktif=0;y.aktif=1;lg(y.kode,'Penggantian Aset APAR',x.kode,y.kode,`${y.kode} ditetapkan sebagai aset aktif sebagai pengganti, sedangkan ${x.kode} dinonaktifkan.`);done(`${y.kode} menggantikan ${x.kode}.`)},'Ganti')},
area(d){const x=DB.a[d.i];modal('Aktifkan Kembali APAR','Periksa data APAR sebelum diaktifkan kembali.',form(AF,x,['kode','merk','tipe','seri','media','jenis','kap'],'<div class="info">Identitas aset tidak dapat diubah. Data lokasi, sub lokasi, tanggal isi ulang, tanggal kedaluwarsa, dan vendor dapat diperbarui sebelum APAR diaktifkan.</div>'),()=>{const o=rd(),e=ver(o);if(e)return e;Object.assign(x,o,{aktif:1});lg(x.kode,'Aktivasi Kembali','Non Aktif','Aktif',`Aset APAR ${x.kode} diaktifkan kembali.`);done(`Aset APAR ${x.kode} berhasil diaktifkan kembali.`)},'Aktifkan','g')},
cadd(d){const[fs,l]=SCH[d.k];modal(`Tambah ${l}`,'',form(fs,{}),()=>{const o=rd(),e=chk(fs,o);if(e)return e;DB[d.k].push(o);done(`${l} ${o.nama} berhasil ditambahkan.`)})},
cedit(d){const[fs,l]=SCH[d.k],x=DB[d.k][d.i],old=x.nama;modal(`Ubah ${l}`,esc(old),form(fs,x),()=>{const o=rd(),e=chk(fs,o);if(e)return e;Object.assign(x,o);if(d.k=='v')DB.a.forEach(a=>{if(a.vendor==old)a.vendor=o.nama});done(`${l} ${o.nama} berhasil diperbarui.`)})},
cdel(d){const l=SCH[d.k][1],x=DB[d.k][d.i];if(d.k=='u'&&x.email==ME.email)return toast('Tidak dapat menghapus akun yang sedang dipakai.',1);if(d.k=='v'&&DB.a.some(a=>a.vendor==x.nama))return toast(`${x.nama} masih dipakai oleh data APAR.`,1);conf(`Hapus ${l.toLowerCase()}?`,esc(x.nama),()=>{DB[d.k].splice(d.i,1);done(`${l} ${x.nama} berhasil dihapus.`)})},
theme(){const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))=='dark'?'light':'dark'},
fdup(d){const f=DB.f[d.i],ref=nref(td0);DB.f.push({ref,tgl:td0,petugas:f.petugas,status:'Draft',cek:JSON.parse(JSON.stringify(f.cek))});done(`Formulir ${ref} disalin dari ${f.ref}.`)},
fprint(d){const f=DB.f[d.i],ak=DB.a.filter(x=>x.aktif),sg=n=>{const t=DB.t[n];return t?`<div style="flex:1;text-align:center"><br><br><br><br><b><u>${esc(t.nama)}</u></b><br>${esc(t.jabatan)}<br>NIPP ${esc(t.nipp)}</div>`:''};modal('Berita Acara Pemantauan APAR',esc(f.ref),`<h3 style="text-align:center;margin:0">BERITA ACARA PEMANTAUAN APAR</h3><p class="mu" style="text-align:center;margin:2px 0 12px">No. ${esc(f.ref)}, ${fl(f.tgl)}, petugas ${esc(f.petugas)}</p><div class="tw"><table><thead><tr><th>No</th><th>Kode</th><th>Lokasi</th><th>Kedaluwarsa</th><th>Kondisi</th><th>Catatan</th></tr></thead><tbody>${ak.map((x,i)=>{const c=f.cek[x.kode];return`<tr><td>${i+1}</td><td class="mono">${x.kode}</td><td>${esc(x.lokasi)}, ${esc(x.sub)}</td><td class="mono">${fmt(x.exp)}</td><td>${c?c.k:'Belum diperiksa'}</td><td>${c?esc(c.c):''}</td></tr>`}).join('')}</tbody></table></div><div style="display:flex;gap:12px;margin-top:20px">${sg(0)}${sg(1)}</div>`,()=>{try{print()}catch(e){}return'Jika dialog cetak tidak muncul, buka halaman ini di tab baru.'},'Cetak','p','w')},
adet(d){const x=DB.a[d.i],r=days(x.exp),h=DB.h.filter(y=>y.kode==x.kode||y.lama==x.kode).reverse();modal(x.kode,`${esc(x.merk)} ${esc(x.jenis)} ${esc(x.kap)}`,`<div class="g">${[['Nomor seri',x.seri],['Tipe',x.tipe],['Media',x.media],['Lokasi',`${x.lokasi}, ${x.sub}`],['Isi ulang',fmt(x.isi)],['Kedaluwarsa',`${fmt(x.exp)} (${r<0?'lewat '+-r:r} hari)`],['Vendor',x.vendor],['Status',x.aktif?'Aktif':'Non Aktif']].map(a=>`<div><small class="mu">${a[0]}</small><br><b>${esc(a[1])}</b></div>`).join('')}</div><h3>Riwayat aset</h3>${h.map(y=>`<p style="margin:4px 0"><span class="mono mu">${fmt(y.tgl)}</span> ${esc(y.ket)}</p>`).join('')||'<p class="mu">Belum ada riwayat.</p>'}`,null)},
out(){if(sbOn){const t=TK;setME(null);render();setTimeout(()=>{if(TK===t)setTK(null)},900)}else{lg('-','Logout','-',ME.email,ME.nama+' keluar dari sistem.');save();setME(null);render()}},
cm(d){const n=+d.n,c=S.cm;if(!n)S.cm={y:+td0.slice(0,4),m:+td0.slice(5,7)-1};else{let m=c.m+n,y=c.y;if(m<0){m=11;y--}if(m>11){m=0;y++}S.cm={y,m}}render()},
bell(){const a=alerts();modal('Notifikasi',`APAR yang kedaluwarsa dalam ${DB.s.ambang} hari`,a.map(x=>{const d=days(x.exp);return`<p style="margin:8px 0"><b class="mono">${x.kode}</b> ${esc(x.lokasi)}<br><span class="bd ${d<0?'er':'wn'}">${d<0?'Kedaluwarsa '+-d+' hari lalu':d+' hari lagi'}</span></p>`}).join('')||'<p class="em">Tidak ada peringatan.</p>',null)},
sprof(){const u=DB.u.find(x=>x.email==ME.email),n=$('#sn').value.trim(),w=$('#sw').value;if(!n)return toast('Nama wajib diisi.',1);if(w){if($('#so').value!=u.pass)return toast('Kata sandi lama salah.',1);if(w.length<6)return toast('Kata sandi baru minimal 6 karakter.',1);u.pass=w}u.nama=n;setME({...ME,nama:n});done('Profil berhasil disimpan.')},
sset(){DB.s.ambang=Math.max(1,+$('#sa').value||30);DB.s.instansi=$('#si').value.trim()||DB.s.instansi;done('Pengaturan berhasil disimpan.')},
sbak(){modal('Cadangan data','Salin teks JSON berikut',`<textarea readonly rows="10">${esc(JSON.stringify(DB))}</textarea>`,null)},
sres(){modal('Pulihkan data','Tempel teks JSON cadangan',`<textarea id="rj" rows="8"></textarea>`,()=>{try{const o=JSON.parse($('#rj').value);if(!o.a||!o.f||!o.u)throw 0;DB=o}catch(e){return'JSON tidak valid.'}done('Data berhasil dipulihkan.')},'Pulihkan')},
tpl(){modal('Template Excel','Salin ke Excel/Google Sheets, lalu simpan sebagai .csv',`<textarea readonly rows="6">${CK.join(',')}\nAPAR-200,Yamato,SN-200,Stored Pressure,Serbuk,ABC Powder,5 Kg,Lobby Kantor,Pintu Barat,${td0},${nextY},PT. Mandiri Jaya</textarea>`,null)},
exp(){modal('Ekspor APAR aktif','Salin data berikut ke Excel/Google Sheets',`<textarea readonly rows="10">${esc(CK.join(',')+'\n'+DB.a.filter(x=>x.aktif).map(x=>CK.map(k=>x[k]).join(',')).join('\n'))}</textarea>`,null,'','', 'w')},
imp(){modal('Import Excel','Pilih file .csv atau tempel data (kolom sama dengan template)',`<input type="file" id="fi" accept=".csv,.txt"><textarea id="ta" rows="7" placeholder="${CK.join(',')}"></textarea>`,()=>{const L=$('#ta').value.split(/\r?\n/).map(l=>l.split(/\t|,/).map(c=>c.trim().replace(/^"|"$/g,''))).filter(r=>r.length>1);if(L[0]&&L[0][0].toLowerCase()=='kode')L.shift();if(!L.length)return'Tidak ada data yang bisa diimpor.';let n=0,s=0;L.forEach(r=>{const o=Object.fromEntries(CK.map((k,i)=>[k,r[i]||'']));if(!o.kode||!o.isi||!o.exp||DB.a.some(y=>y.kode==o.kode)){s++;return}DB.a.push({...o,aktif:1});addV(o.vendor);lg(o.kode,'Tambah APAR','-','Aktif',`Aset APAR ${o.kode} diimpor.`);n++});done(`${n} APAR berhasil diimpor${s?`, ${s} baris dilewati (kode kosong, duplikat, atau tanggal kosong)`:''}.`)},'Import')}};
document.addEventListener('click',e=>{if(e.target.classList.contains('ov'))return act.close();const t=e.target.closest('[data-a]');if(t&&/^(adel|fdel|cdel|reset)$/.test(t.dataset.a)&&!adm())return toast('Hanya Admin yang dapat melakukan aksi ini.',1);if(t&&act[t.dataset.a])act[t.dataset.a](t.dataset)});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='q'){S.q=t.value;S.tab='forms';S.p.f=1;render()}if(t.id=='aq'){S.aq=t.value;S.p.a=1;render()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id=='fs'){S.fs=t.value;S.p.f=1;render()}if(t.id=='win'){S.win=t.value;render()}if(t.id=='fi'&&t.files[0])t.files[0].text().then(x=>$('#ta').value=x)});
document.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);if(sbOn){$('#le').textContent='Memproses...';try{const r=await fetch(SB.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify({email:f.get('e').trim(),password:f.get('p')})}),j=await r.json();if(!r.ok)throw 0;setTK({a:j.access_token,r:j.refresh_token});const m=j.user;setME({nama:(m.user_metadata||{}).nama||m.email.split('@')[0],email:m.email,role:(m.app_metadata||{}).role=='Admin'?'Admin':'Petugas'});S.v='dash';await pull();lg('-','Login','-',m.email,ME.nama+' ('+ME.role+') masuk ke sistem.');save()}catch(x){$('#le').textContent='Email atau kata sandi salah, atau Supabase tidak dapat dihubungi.'}return}const u=DB.u.find(x=>x.email==f.get('e').trim().toLowerCase()&&x.pass==f.get('p'));if(!u){$('#le').textContent='Email atau kata sandi salah.';return}setME({nama:u.nama,email:u.email,role:u.role});lg('-','Login','-',u.email,u.nama+' ('+u.role+') masuk ke sistem.');save();S.v='dash';render()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')act.close();if(e.key=='Enter'&&e.target.id=='hq')act.hf()});
if(innerWidth<800)document.body.classList.add('c');S.v='dash';$('#hl').src=LOGO;render();if(sbOn&&ME&&TK)pull();addEventListener('focus',()=>{if(sbOn&&ME&&TK&&!dirty&&!document.querySelector('#m .ov'))pull()});
</script></body></html>
